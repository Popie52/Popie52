<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Story routes: PulseNet, DocuMind, job-queue-go, Sentinel">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14102E"/>
      <stop offset="1" stop-color="#1C1648"/>
    </linearGradient>
    <pattern id="rtone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.05" fill="#FFD6EA" opacity="0.10"/>
    </pattern>
    <style>
      .cursor { animation: bob 1.4s ease-in-out infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .spin { transform-origin: 1060px 268px; animation: spin 8s linear infinite; }
      @keyframes bob { 0%,100% { transform: translateX(0) } 50% { transform: translateX(5px) } }
      @keyframes pulse { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>

  <rect width="1200" height="430" fill="url(#rbg)"/>
  <rect width="1200" height="430" fill="url(#rtone)"/>
  <rect x="10" y="10" width="1180" height="410" rx="18" stroke="#6EF0E8" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="394" rx="12" stroke="#FF4D8A" stroke-width="1" opacity="0.4"/>

  <text x="48" y="56" fill="#6EF0E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3.2">STORY ROUTES</text>
  <text x="48" y="86" fill="#FFF6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="26" font-weight="800">Choose a chapter.</text>
  <text x="1152" y="56" text-anchor="end" fill="#FFB4D2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">4 MAIN  /  2 SIDE</text>
  <text x="1152" y="78" text-anchor="end" fill="#9AA3C7" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="13">links in the log below</text>

  <!-- PulseNet -->
  <rect x="40" y="108" width="270" height="282" rx="16" fill="#1A1638" stroke="#FF4D8A" stroke-width="2.4"/>
  <path class="cursor" d="M28 140 L40 152 L28 164Z" fill="#FF4D8A"/>
  <text x="58" y="138" fill="#FF4D8A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">CH. 01  /  SELECTED</text>
  <text x="58" y="176" fill="#FFF6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="24" font-weight="800">PulseNet</text>
  <text x="58" y="202" fill="#FFB4D2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">VANGUARD</text>
  <g transform="translate(118, 228)">
    <circle class="pulse" cx="48" cy="40" r="28" fill="none" stroke="#FF4D8A" stroke-width="3"/>
    <circle class="pulse" cx="48" cy="40" r="16" fill="none" stroke="#6EF0E8" stroke-width="2" opacity="0.8"/>
    <circle cx="48" cy="40" r="6" fill="#FF4D8A"/>
    <circle cx="12" cy="18" r="4" fill="#6EF0E8"/>
    <circle cx="86" cy="22" r="4" fill="#FFD36A"/>
    <circle cx="80" cy="64" r="4" fill="#6EF0E8"/>
    <path d="M16 20 L42 36 M82 24 L54 36 M78 62 L52 46" stroke="#C9C6E8" stroke-width="1.4"/>
  </g>
  <text x="58" y="348" fill="#C9C6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="13">Realtime messaging fabric.</text>
  <text x="58" y="368" fill="#9AA3C7" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="12">Auth + message services.</text>

  <!-- DocuMind -->
  <rect x="326" y="108" width="270" height="282" rx="16" fill="#1A1638" stroke="#6EF0E8" stroke-width="1.6"/>
  <text x="344" y="138" fill="#6EF0E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">CH. 02</text>
  <text x="344" y="176" fill="#FFF6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="24" font-weight="800">DocuMind</text>
  <text x="344" y="202" fill="#6EF0E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ARCHIVIST</text>
  <g transform="translate(400, 228)">
    <rect x="18" y="8" width="64" height="72" rx="6" fill="#FFF4E6"/>
    <rect x="26" y="20" width="48" height="6" rx="2" fill="#FF4D8A"/>
    <rect x="26" y="34" width="40" height="4" rx="2" fill="#C9C6E8"/>
    <rect x="26" y="46" width="44" height="4" rx="2" fill="#C9C6E8"/>
    <rect x="26" y="58" width="28" height="4" rx="2" fill="#C9C6E8"/>
    <path d="M70 4 L88 22 L70 22Z" fill="#FFD36A"/>
    <path class="pulse" d="M96 12 L100 22 L110 24 L100 26 L96 36 L92 26 L82 24 L92 22Z" fill="#6EF0E8"/>
  </g>
  <text x="344" y="348" fill="#C9C6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="13">Telegram RAG assistant.</text>
  <text x="344" y="368" fill="#9AA3C7" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="12">Parse, embed, cite, answer.</text>

  <!-- job-queue-go -->
  <rect x="612" y="108" width="270" height="282" rx="16" fill="#1A1638" stroke="#FFD36A" stroke-width="1.6"/>
  <text x="630" y="138" fill="#FFD36A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">CH. 03</text>
  <text x="630" y="176" fill="#FFF6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="22" font-weight="800">job-queue-go</text>
  <text x="630" y="202" fill="#FFD36A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">KEEPER</text>
  <g transform="translate(678, 232)">
    <rect x="8" y="48" width="88" height="22" rx="4" fill="#3A4278"/>
    <rect x="20" y="28" width="88" height="22" rx="4" fill="#4A5490"/>
    <rect x="32" y="8" width="88" height="22" rx="4" fill="#6EF0E8"/>
    <path d="M108 14 L116 20 L108 26" stroke="#14102E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="58" r="3" fill="#FF4D8A"/>
    <circle cx="32" cy="38" r="3" fill="#FFD36A"/>
  </g>
  <text x="630" y="348" fill="#C9C6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="13">Crash-safe priority queue.</text>
  <text x="630" y="368" fill="#9AA3C7" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="12">Postgres is source of truth.</text>

  <!-- Sentinel -->
  <rect x="898" y="108" width="262" height="282" rx="16" fill="#1A1638" stroke="#C9C6E8" stroke-width="1.6"/>
  <text x="916" y="138" fill="#C9C6E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">CH. 04</text>
  <text x="916" y="176" fill="#FFF6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="24" font-weight="800">Sentinel</text>
  <text x="916" y="202" fill="#C9C6E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">SCOUT</text>
  <g>
    <circle cx="1060" cy="268" r="36" fill="none" stroke="#3A4278" stroke-width="2"/>
    <circle cx="1060" cy="268" r="22" fill="none" stroke="#3A4278" stroke-width="1.4"/>
    <circle cx="1060" cy="268" r="8" fill="#FF4D8A"/>
    <path class="spin" d="M1060 268 L1060 232" stroke="#6EF0E8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M1024 268 H1096 M1060 232 V304" stroke="#3A4278" stroke-width="1"/>
  </g>
  <text x="916" y="348" fill="#C9C6E8" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="13">TCP scanner from POSIX up.</text>
  <text x="916" y="368" fill="#9AA3C7" font-family="ui-sans-serif, system-ui, Inter, Arial, sans-serif" font-size="12">Sockets, poll(), CTest.</text>
</svg>
