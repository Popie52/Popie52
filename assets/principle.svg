<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
 <style>
 .draw{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 3s ease-out forwards}.dot{animation:pop 2.6s ease-in-out infinite}.arrow{animation:slide 2.6s ease-in-out infinite}
 @keyframes draw{to{stroke-dashoffset:0}} @keyframes pop{0%,100%{opacity:.35}50%{opacity:1}} @keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
 </style>
</defs>
<rect width="1200" height="250" rx="24" fill="#171717"/>
<text x="60" y="58" fill="#FFB38F" font-family="JetBrains Mono" font-size="10" letter-spacing="2">ENGINEERING PRINCIPLE</text>
<text x="60" y="120" fill="#F4F1EA" font-family="Inter,Arial" font-size="34" font-weight="700">Understand the system.</text>
<text x="60" y="162" fill="#C8C4BB" font-family="Inter,Arial" font-size="22">Then decide where the abstraction belongs.</text>
<path class="draw" d="M60 199H1140" stroke="#FF5C35" stroke-width="2"/>
<circle class="dot" cx="60" cy="199" r="5" fill="#FF5C35"/>
<g class="arrow"><path d="M1110 187L1140 199L1110 211" stroke="#FF5C35" stroke-width="2"/></g>
</svg>
